# Override CI — supprime les bind mounts de fichiers (incompatibles Docker socket)
# Les configs mosquitto sont générées inline au démarrage du conteneur

services:
  bresil-mqtt:
    volumes:
      - bresil_mqtt_data:/mosquitto/data
      - bresil_mqtt_logs:/mosquitto/log
    entrypoint: >
      sh -c "printf 'allow_anonymous true\nlistener 1883\n'
      > /mosquitto/config/mosquitto.conf
      && mosquitto -c /mosquitto/config/mosquitto.conf"

  equateur-mqtt:
    volumes:
      - equateur_mqtt_data:/mosquitto/data
      - equateur_mqtt_logs:/mosquitto/log
    entrypoint: >
      sh -c "printf 'allow_anonymous true\nlistener 1883\n'
      > /mosquitto/config/mosquitto.conf
      && mosquitto -c /mosquitto/config/mosquitto.conf"

  colombie-mqtt:
    volumes:
      - colombie_mqtt_data:/mosquitto/data
      - colombie_mqtt_logs:/mosquitto/log
    entrypoint: >
      sh -c "printf 'allow_anonymous true\nlistener 1883\n'
      > /mosquitto/config/mosquitto.conf
      && mosquitto -c /mosquitto/config/mosquitto.conf"
